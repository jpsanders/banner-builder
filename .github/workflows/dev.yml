---
name: banner-builder-ci

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  # Run CI manually
  workflow_dispatch:

jobs:
  lint:
    uses: "./.github/workflows/python-checks.yml"
  test:
    needs: lint
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    uses: "./.github/workflows/python-tests.yml"
    with:
      python-version: ${{ matrix.python-version }}
  # Proves a plain install works and ships the fonts and the starter config, with no make step first.
  package:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Install from the clean checkout into a new environment, the way a user would"
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .

      - name: "Write the starter config, check it and build from it"
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          export BANNER_BUILDER_CONFIG="$RUNNER_TEMP/config/banner.toml"
          banner-builder init
          banner-builder check
          banner-builder build --out out
          ls -l out
          test -s out/banner-light@2x.png
          test -s out/banner-dark.svg
